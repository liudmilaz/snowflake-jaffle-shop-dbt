version: 2

sources:
  - name: jaffle_shop
    description: Raw replica of the jaffle_shop app's Postgres database, loaded into Snowflake from S3.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        config:
          event_time: order_date
