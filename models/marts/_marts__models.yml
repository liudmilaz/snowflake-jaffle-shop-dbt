version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension. One row per customer (current state only),
      descriptive attributes only -- no aggregates. See
      `fct_customer_order_summary` for order-history metrics, and
      `dim_customers_snapshot` for SCD Type 2 history of these
      attributes over time.
    config:
      meta:
        joins:
          - join: fct_orders
            relationship: one-to-many
            sql_on: ${dim_customers.customer_id} = ${fct_orders.customer_id}
          # joins are not transitive: needed so fct_orders' true_avg_order_value resolves here
          - join: fct_order_adjustments
            relationship: one-to-many
            sql_on: ${fct_orders.order_id} = ${fct_order_adjustments.order_id}
    columns:
      - name: customer_id
        description: Primary key.
        config:
          meta:
            metrics:
              total_customers:
                type: count_distinct
                label: Total customers
              # Lives here, not on fct_orders: with customers as the base
              # table every customer is counted, including those with no
              # orders. From fct_orders the denominator only counts
              # customers who have ordered.
              orders_per_customer:
                type: number
                label: Orders per customer
                sql: ${fct_orders.total_orders} / NULLIF(${total_customers}, 0)
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name (current version).
      - name: last_name
        description: Customer last name, abbreviated (current version).

  - name: fct_customer_order_summary
    description: >
      Accumulating-snapshot fact: one row per customer, with lifetime
      order metrics (first/most recent order date, order count) as of
      the last dbt build. Not date-filterable -- for date-scoped order
      metrics, aggregate `fct_orders` directly instead.
    columns:
      - name: customer_id
        description: Foreign key to `dim_customers`. One row per customer, so also unique here.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: number_of_orders
        description: Lifetime count of orders placed by this customer. 0, not null, if they haven't ordered yet.

  - name: fct_orders
    description: >
      Order fact table. One row per order, at the same grain as
      `stg_orders`, with the total successfully-paid amount as its
      measure. Joins to `dim_customers` via `customer_id`. Incremental
      (merge/unique_key=order_id) -- see the model's own comments for
      how it re-scopes on late-arriving payments.
    config:
      meta:
        joins:
          - join: dim_customers
            relationship: many-to-one
            sql_on: ${fct_orders.customer_id} = ${dim_customers.customer_id}
          - join: fct_order_adjustments
            relationship: one-to-many
            sql_on: ${fct_orders.order_id} = ${fct_order_adjustments.order_id}
    columns:
      - name: order_id
        description: Primary key.
        config:
          meta:
            metrics:
              total_orders:
                type: count_distinct
                label: Total orders
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order lifecycle status (placed, shipped, completed, return_pending, returned).
      - name: amount
        description: >
          Total amount successfully paid for the order, in dollars.
          Frozen once order_date falls in a closed period (period_close)
          -- see fct_order_adjustments for corrections booked after close.
        config:
          meta:
            metrics:
              total_revenue:
                type: sum
                label: Total revenue
                format: usd
              avg_order_value:
                type: number
                label: Avg order value
                format: usd
                sql: ${total_revenue} / NULLIF(${total_orders}, 0)
              true_avg_order_value:
                type: number
                label: True avg order value
                format: usd
                sql: (${total_revenue} + COALESCE(${fct_order_adjustments.total_adjustments}, 0)) / NULLIF(${total_orders}, 0)

  - name: fct_order_adjustments
    description: >
      Append-only ledger of corrections to orders in an already-closed
      accounting period. Each row is the residual delta between the
      true, currently-known payment total and what's already been
      recognized (frozen fct_orders.amount + prior adjustments),
      recognized in the current open period rather than restating the
      closed one. Never updated or deleted once written.
    columns:
      - name: adjustment_id
        description: Primary key (hash of order_id + booking timestamp).
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to `fct_orders`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: amount_delta
        description: Correction amount, in dollars. Can be negative (an overpayment correction).
        config:
          meta:
            metrics:
              total_adjustments:
                type: sum
                label: Total adjustments
                format: usd
        data_tests:
          - not_null
      - name: reason
        data_tests:
          - accepted_values:
              arguments:
                values: ['late_arriving_payment']
