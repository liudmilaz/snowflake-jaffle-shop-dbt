version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension. One row per customer, descriptive attributes
      only -- no aggregates. See `fct_customer_order_summary` for
      order-history metrics.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null

  - name: fct_customer_order_summary
    description: >
      Accumulating-snapshot fact: one row per customer, with lifetime
      order metrics (first/most recent order date, order count) as of
      the last dbt build. Not date-filterable -- for date-scoped order
      metrics, aggregate `fct_orders` directly instead.
    columns:
      - name: customer_id
        description: Foreign key to `dim_customers`. One row per customer, so also unique here.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: number_of_orders
        description: Lifetime count of orders placed by this customer. 0, not null, if they haven't ordered yet.

  - name: fct_orders
    description: >
      Order fact table. One row per order, at the same grain as
      `stg_orders`, with the total successfully-paid amount as its
      measure. Joins to `dim_customers` via `customer_id`.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        description: Total amount successfully paid for the order, in dollars.
