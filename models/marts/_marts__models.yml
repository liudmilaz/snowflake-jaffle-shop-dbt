version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension. One row per customer, enriched with order-history
      attributes (first/most recent order date, order count) from
      `int_customer_orders`.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: >
      Order fact table. One row per order, at the same grain as
      `stg_orders`, with the total successfully-paid amount as its
      measure. Joins to `dim_customers` via `customer_id`.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        description: Total amount successfully paid for the order, in dollars.
